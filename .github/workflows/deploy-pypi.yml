name: Deploy to PyPI

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish, for example v3.0.2
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts uploads from this workflow and
    # environment without a stored token. Configure it once on PyPI for the
    # project `pywebasto-ng` (see README, "Publishing").
    environment:
      name: pypi
      url: https://pypi.org/p/pywebasto-ng
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::Missing release tag."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      # The version is stamped into the build only; nothing is pushed back to main.
      - name: Stamp version ${{ env.RELEASE_TAG }}
        run: |
          python3 .github/scripts/update_poetry_version_stamp.py --version "${RELEASE_TAG}"

      - name: Install poetry
        run: pipx install poetry

      - name: Build
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
