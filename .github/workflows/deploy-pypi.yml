name: Deploy to PyPI

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish, for example v3.0.2
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::Missing release tag."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Validate PyPI token
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::error::Missing secret PYPI_TOKEN."
            exit 1
          fi

      # The version is stamped into the build only; nothing is pushed back to main.
      - name: Stamp version ${{ env.RELEASE_TAG }}
        run: |
          python3 .github/scripts/update_poetry_version_stamp.py --version "${RELEASE_TAG}"

      - name: Install poetry
        run: pipx install poetry

      - name: Build
        run: poetry build

      - name: Publish
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: poetry publish
